# Each run does four things in order:
#   1. copies the data from the Google Sheet into the three CSV files
#   2. checks the data
#   3. saves the CSV files to the project, so every published version is in the history
#   4. updates the website
# If step 1 or 2 fails, nothing is saved and the website stays as it was.
#
# It runs when you click "Run workflow" on the Actions tab, and whenever a file
# in the project changes.
name: Check data and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# If two runs start close together, do them one after the other.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4
      - name: Copy the data from the Google Sheet
        run: python3 fetch_sheet.py
      - name: Check the data
        run: python3 validate.py
      - name: Save the data files to the project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add species.csv institutions.csv holdings.csv
          if git diff --cached --quiet; then
            echo "The data has not changed since the last run."
          else
            git commit -m "Update data from the Google Sheet"
            git push origin HEAD:main
          fi
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v5
